<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FVT Form Scanner</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f6fa;color:#1a1a2e;min-height:100vh}
  .header{background:linear-gradient(135deg,#e67e22,#f39c12);padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(230,126,34,0.3)}
  .header h1{color:#fff;font-size:18px;font-weight:600}
  .header span.sub{color:rgba(255,255,255,0.85);font-size:13px}
  .container{max-width:640px;margin:0 auto;padding:20px 16px}
  .card{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,0.07);border:1px solid #eee}
  .step-bar{display:flex;align-items:flex-start;justify-content:center;margin-bottom:24px}
  .step-dot{display:flex;flex-direction:column;align-items:center;gap:4px}
  .dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;transition:all .3s}
  .dot.done{background:#27ae60;color:#fff}
  .dot.active{background:#e67e22;color:#fff}
  .dot.pending{background:#e0e0e0;color:#888}
  .step-dot label{font-size:10px;color:#888;margin-top:2px}
  .step-line{width:36px;height:2px;background:#e0e0e0;margin-top:14px}
  .upload-area{border:2.5px dashed #f0a040;border-radius:14px;padding:36px 20px;text-align:center;cursor:pointer;background:#fffbf5;transition:all .2s}
  .upload-area:hover,.upload-area.drag{border-color:#e67e22;background:#fff5e6}
  .upload-icon{font-size:44px;margin-bottom:10px;display:block}
  input[type=text],input[type=number],input[type=password],textarea{
    width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;outline:none;transition:border .2s;font-family:inherit;color:#333;background:#fff}
  input:focus,textarea:focus{border-color:#e67e22;box-shadow:0 0 0 3px rgba(230,126,34,0.1)}
  textarea{resize:vertical;min-height:65px}
  .fg{margin-bottom:14px}
  .fg label{display:block;font-size:12px;font-weight:600;color:#666;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  .sec-title{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #f5f5f5}
  .sec-title h3{font-size:14px;font-weight:600;color:#333}
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
  .chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid #e0e0e0;border-radius:10px;cursor:pointer;transition:all .15s;background:#fafafa;user-select:none}
  .chip:hover{border-color:#e67e22;background:#fff5e6}
  .chip.sel{border-color:#27ae60;background:#f0fff5}
  .cb{width:16px;height:16px;border-radius:4px;border:1.5px solid #ccc;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
  .chip.sel .cb{background:#27ae60;border-color:#27ae60;color:#fff}
  .chip .ct b{display:block;font-size:12px;font-weight:600;color:#333;line-height:1.2}
  .chip .ct span{font-size:11px;color:#888}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:inherit;width:100%}
  .btn-orange{background:linear-gradient(135deg,#e67e22,#f39c12);color:#fff;box-shadow:0 3px 12px rgba(230,126,34,0.3)}
  .btn-orange:hover{transform:translateY(-1px)}
  .btn-green{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff;box-shadow:0 3px 12px rgba(39,174,96,0.25)}
  .btn-gray{background:#f0f0f0;color:#555;border:1.5px solid #ddd}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:flex;align-items:flex-start;gap:8px}
  .alert-ok{background:#f0fff5;border:1px solid #a8e6c1;color:#1a7a40}
  .alert-warn{background:#fffbf0;border:1px solid #f9d77e;color:#7a5f00}
  .infobox{background:#f8f9ff;border:1px solid #d0d8ff;border-radius:10px;padding:12px 14px;font-size:13px;color:#445;margin-bottom:14px;line-height:1.6}
  .spinner{width:44px;height:44px;border-radius:50%;border:3px solid #f0a040;border-top-color:transparent;animation:spin .8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .thumb{width:60px;height:60px;object-fit:cover;border-radius:8px;border:2px solid #f0a040;cursor:pointer;flex-shrink:0}
  .free-badge{background:#27ae60;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px}
  .praise-card{border-left:4px solid #27ae60}
  .prayer-card{border-left:4px solid #e74c3c}
  a{color:#e67e22}
  .note{font-size:12px;color:#aaa;margin-top:5px}
  @media(max-width:480px){.grid2{grid-template-columns:1fr}.chips{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <span style="font-size:26px">📋</span>
  <div>
    <h1>FVT Form Scanner</h1>
    <span class="sub">Field Visit Tracking — AI Powered &nbsp;<span style="background:rgba(255,255,255,0.25);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px">100% FREE</span></span>
  </div>
</div>

<div class="container" id="app"></div>

<script>
const FORM_ID = "261471008997061";
const PRAISE_CATS = [
  {key:"HCPM_VISION",  en:"Following HCPM Vision",   hi:"HCPM Vision"},
  {key:"FAMILY_UNITY", en:"Family Unity in God",      hi:"परिवार में एकता"},
  {key:"EVANGELISM",   en:"Progress in Evangelism",   hi:"Evangelism प्रगति"},
  {key:"DISCIPLESHIP", en:"Discipleship Growth",      hi:"शिष्यत्व विकास"},
  {key:"NEW_BELIEVERS",en:"New Believers Added",      hi:"नए विश्वासी"},
  {key:"ACTIVE_MINISTRY",en:"Active in Ministry",    hi:"Ministry सक्रिय"},
  {key:"GOSPEL_SHARING",en:"Actively Sharing Gospel",hi:"Gospel Share"},
];
const PRAYER_CATS = [
  {key:"FINANCIAL",      en:"Financial Difficulty",   hi:"आर्थिक समस्या"},
  {key:"HEALTH",         en:"Health Issue",           hi:"स्वास्थ्य"},
  {key:"MARRIAGE",       en:"Marriage Need",          hi:"शादी"},
  {key:"CHURCH_PLANTING",en:"Church Planting",        hi:"कलीसिया रोपण"},
  {key:"FAMILY_ISSUE",   en:"Family Issue",           hi:"पारिवारिक"},
  {key:"SPIRITUAL",      en:"Spiritual Challenge",    hi:"आत्मिक"},
  {key:"COMMUNITY",      en:"Community Problem",      hi:"सामाजिक समस्या"},
  {key:"EDUCATION",      en:"Education Issue",        hi:"शिक्षा"},
];

let S = {
  screen: localStorage.getItem('gemini_key') ? 'upload' : 'setup',
  preview: null, error: '',
  form: {fvtName:'',date:'',workerName:'',location:'',familyMembers:'',praiseKeys:[],praiseOther:'',prayerKeys:[],prayerOther:'',remarks:''}
};

const gKey = () => localStorage.getItem('gemini_key')||'';
const jKey = () => localStorage.getItem('jotform_key')||'';
const esc  = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function stepBar(cur){
  const names=['Setup','Upload','Scanning','Review','Done'];
  const ids  =['setup','upload','extracting','edit','done'];
  const ci   = ids.indexOf(cur);
  return `<div class="step-bar">${names.map((n,i)=>`
    <div class="step-dot">
      <div class="dot ${i<ci?'done':i===ci?'active':'pending'}">${i<ci?'✓':i+1}</div>
      <label>${n}</label>
    </div>${i<4?'<div class="step-line"></div>':''}`).join('')}</div>`;
}

/* ── SCREENS ─────────────────────────────────── */
function renderSetup(){
  return `<div class="card">
    <div class="sec-title"><span style="font-size:22px">🔑</span><h3>One-time Setup <span class="free-badge">FREE</span></h3></div>
    <div class="infobox">
      Sirf ek baar API keys enter karo — device pe save ho jaayengi.<br>
      Dono keys bilkul <b>free</b> hain!
    </div>

    <div class="fg">
      <label>Google Gemini API Key * <span class="free-badge">FREE</span></label>
      <input type="password" id="inp_gemini" placeholder="AIzaSy..." value="${esc(gKey())}">
      <p class="note">🔗 Free key yahan milegi → <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a> (Google account se login karo, "Create API Key" click karo)</p>
    </div>

    <div class="fg">
      <label>Jotform API Key * <span class="free-badge">FREE</span></label>
      <input type="password" id="inp_jotform" placeholder="Your Jotform API key..." value="${esc(jKey())}">
      <p class="note">🔗 Free key yahan milegi → <a href="https://www.jotform.com/myaccount/api" target="_blank">jotform.com/myaccount/api</a></p>
    </div>

    <button class="btn btn-orange" id="btn_save">💾 Save & Start Scanning</button>
  </div>`;
}

function renderUpload(){
  return `<div>
    ${stepBar('upload')}
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div class="sec-title" style="margin:0;border:none;padding:0"><span style="font-size:20px">📷</span><h3 style="margin-left:6px">FVT Form Photo Upload</h3></div>
        <button class="btn btn-gray" id="btn_settings" style="width:auto;padding:6px 12px;font-size:12px">⚙️</button>
      </div>
      <div class="upload-area" id="upload_area">
        <span class="upload-icon">📸</span>
        <h3 style="font-size:15px;color:#333;margin-bottom:6px">Click ya drag & drop karo</h3>
        <p style="font-size:13px;color:#888">Handwritten Hindi FVT form ka photo — JPG ya PNG</p>
        <input type="file" id="file_inp" accept="image/*" style="display:none">
      </div>
      <div class="infobox" style="margin-top:14px;margin-bottom:0">
        ✨ <b>Kaise kaam karta hai:</b> Photo upload → Gemini AI Hindi padhega → categories auto-tick → tum check karo → Jotform mein save
      </div>
    </div>
  </div>`;
}

function renderExtracting(){
  return `<div>
    ${stepBar('extracting')}
    <div class="card" style="text-align:center;padding:40px 20px">
      <div class="spinner"></div>
      <h3 style="font-size:16px;margin-bottom:8px">AI form padh raha hai...</h3>
      <p style="font-size:13px;color:#888;margin-bottom:16px">Hindi text extract ho raha hai, categories map ho rahi hain</p>
      ${S.preview?`<img src="${S.preview}" style="max-width:100px;max-height:100px;object-fit:contain;border-radius:8px;border:2px solid #f0a040" alt="form">` : ''}
    </div>
  </div>`;
}

function renderEdit(){
  const f = S.form;
  const pc = PRAISE_CATS.map(c=>`
    <div class="chip ${f.praiseKeys.includes(c.key)?'sel':''}" data-t="praise" data-k="${c.key}">
      <div class="cb">${f.praiseKeys.includes(c.key)?'✓':''}</div>
      <div class="ct"><b>${c.en}</b><span>${c.hi}</span></div>
    </div>`).join('');
  const qc = PRAYER_CATS.map(c=>`
    <div class="chip ${f.prayerKeys.includes(c.key)?'sel':''}" data-t="prayer" data-k="${c.key}">
      <div class="cb">${f.prayerKeys.includes(c.key)?'✓':''}</div>
      <div class="ct"><b>${c.en}</b><span>${c.hi}</span></div>
    </div>`).join('');

  return `<div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <h2 style="font-size:18px;font-weight:600">Review & Edit</h2>
      ${S.preview?`<img src="${S.preview}" class="thumb" id="btn_reup" title="Re-upload">`:
        `<button class="btn btn-gray" id="btn_reup" style="width:auto;padding:7px 12px;font-size:12px">📷 Re-upload</button>`}
    </div>
    ${S.error
      ? `<div class="alert alert-warn">⚠️ ${S.error} — Neeche manually fill karo</div>`
      : `<div class="alert alert-ok">✅ AI extraction done — check karo aur edit karo if needed</div>`}
    ${stepBar('edit')}

    <div class="card">
      <div class="sec-title"><span style="font-size:18px">👤</span><h3>Basic Info</h3></div>
      <div class="grid2">
        <div class="fg"><label>FVTs का नाम / FVT Name</label><input type="text" id="f_fvtName" value="${esc(f.fvtName)}"></div>
        <div class="fg"><label>दिनांक / Date</label><input type="text" id="f_date" value="${esc(f.date)}"></div>
        <div class="fg"><label>सेवक का नाम / Worker Name</label><input type="text" id="f_workerName" value="${esc(f.workerName)}"></div>
        <div class="fg"><label>परिवार सदस्य / Family Members</label><input type="number" id="f_familyMembers" value="${esc(f.familyMembers)}"></div>
      </div>
      <div class="fg"><label>स्थान / Location & Address</label><input type="text" id="f_location" value="${esc(f.location)}"></div>
    </div>

    <div class="card praise-card">
      <div class="sec-title"><span style="font-size:18px">🙏</span><h3>प्रशंसा के बिंदु / Praise Points</h3></div>
      <div class="chips" id="praise_chips">${pc}</div>
      <div class="fg"><label>Other / अन्य विवरण</label><textarea id="f_praiseOther" rows="2">${esc(f.praiseOther)}</textarea></div>
    </div>

    <div class="card prayer-card">
      <div class="sec-title"><span style="font-size:18px">🤲</span><h3>प्रार्थना के बिंदु / Prayer Points</h3></div>
      <div class="chips" id="prayer_chips">${qc}</div>
      <div class="fg"><label>Other / अन्य विवरण</label><textarea id="f_prayerOther" rows="2">${esc(f.prayerOther)}</textarea></div>
    </div>

    <div class="card">
      <div class="sec-title"><span style="font-size:18px">📝</span><h3>टिप्पणी / Remarks</h3></div>
      <div class="fg"><textarea id="f_remarks" rows="3">${esc(f.remarks)}</textarea></div>
    </div>

    <div style="display:flex;gap:10px;margin-bottom:24px">
      <button class="btn btn-gray" id="btn_reup2" style="flex:1">📷 Re-upload</button>
      <button class="btn btn-green" id="btn_submit" style="flex:2.5">🚀 Submit to Jotform</button>
    </div>
  </div>`;
}

function renderDone(){
  return `<div>
    ${stepBar('done')}
    <div class="card" style="text-align:center;padding:30px 20px">
      <div style="font-size:54px;margin-bottom:12px">✅</div>
      <h3 style="font-size:18px;color:#27ae60;margin-bottom:8px">Jotform mein save ho gaya!</h3>
      <p style="font-size:14px;color:#666;margin-bottom:20px">FVT form data successfully submit ho gaya.</p>
      <button class="btn btn-orange" id="btn_another">📷 Scan Another Form</button>
    </div>
    <div class="card" style="text-align:center">
      <p style="font-size:13px;color:#888;margin-bottom:8px">Saare submissions dekhne ke liye:</p>
      <a href="https://www.jotform.com/inbox/${FORM_ID}" target="_blank" style="font-weight:600;font-size:14px">📊 Open Jotform Inbox →</a>
    </div>
  </div>`;
}

/* ── RENDER + EVENTS ──────────────────────────── */
function render(){
  const app = document.getElementById('app');
  const screens = {setup:renderSetup, upload:renderUpload, extracting:renderExtracting, edit:renderEdit, done:renderDone};
  app.innerHTML = (screens[S.screen]||renderUpload)();
  bind();
}

function bind(){
  const $=id=>document.getElementById(id);

  if(S.screen==='setup'){
    $('btn_save').onclick=()=>{
      const gk=$('inp_gemini').value.trim(), jk=$('inp_jotform').value.trim();
      if(!gk){alert('Gemini API key required!');return;}
      if(!jk){alert('Jotform API key required!');return;}
      localStorage.setItem('gemini_key',gk);
      localStorage.setItem('jotform_key',jk);
      S.screen='upload'; render();
    };
  }

  if(S.screen==='upload'){
    const ua=$('upload_area'), fi=$('file_inp');
    ua.onclick=()=>fi.click();
    ua.ondragover=e=>{e.preventDefault();ua.classList.add('drag')};
    ua.ondragleave=()=>ua.classList.remove('drag');
    ua.ondrop=e=>{e.preventDefault();ua.classList.remove('drag');handleFile(e.dataTransfer.files[0])};
    fi.onchange=e=>handleFile(e.target.files[0]);
    $('btn_settings').onclick=()=>{S.screen='setup';render()};
  }

  if(S.screen==='edit'){
    document.querySelectorAll('.chip').forEach(c=>{
      c.onclick=()=>{
        const fld=c.dataset.t==='praise'?'praiseKeys':'prayerKeys', key=c.dataset.k;
        const a=S.form[fld];
        S.form[fld]=a.includes(key)?a.filter(k=>k!==key):[...a,key];
        render();
      };
    });
    ['fvtName','date','workerName','location','familyMembers','praiseOther','prayerOther','remarks'].forEach(k=>{
      const el=$('f_'+k); if(el) el.oninput=e=>S.form[k]=e.target.value;
    });
    const reup=()=>{S.screen='upload';S.preview=null;render()};
    if($('btn_reup'))  $('btn_reup').onclick=reup;
    if($('btn_reup2')) $('btn_reup2').onclick=reup;
    $('btn_submit').onclick=submitForm;
  }

  if(S.screen==='done'){
    $('btn_another').onclick=()=>{
      S={...S, screen:'upload', preview:null, error:'',
        form:{fvtName:'',date:'',workerName:'',location:'',familyMembers:'',praiseKeys:[],praiseOther:'',prayerKeys:[],prayerOther:'',remarks:''}};
      render();
    };
  }
}

/* ── FILE HANDLER ─────────────────────────────── */
function handleFile(file){
  if(!file||!file.type.startsWith('image/'))return;
  const reader=new FileReader();
  reader.onload=async ev=>{
    const b64=ev.target.result.split(',')[1];
    S.preview=ev.target.result;
    S.screen='extracting'; render();
    await extractData(b64, file.type);
  };
  reader.readAsDataURL(file);
}

/* ── GEMINI API ───────────────────────────────── */
async function extractData(b64, mimeType){
  S.error='';
  try{
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash-latest:generateContent?key=${gKey()}`,
      { method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ contents:[{ parts:[
          { inline_data:{ mime_type:mimeType, data:b64 } },
          { text:`Read this handwritten Hindi FVT (Field Visit Tracking) form image carefully. Return ONLY valid JSON, no markdown, no explanation:
{"fvtName":"","date":"","workerName":"","location":"","familyMembers":"","praiseKeys":[],"praiseOther":"","prayerKeys":[],"prayerOther":"","remarks":""}

praiseKeys - pick ALL matching values:
HCPM_VISION = mentions HCPM or darpan or vision
FAMILY_UNITY = family living together for Prabhu/God
EVANGELISM = evangelism or 2:14 progress
DISCIPLESHIP = discipleship or shishyatva
NEW_BELIEVERS = new believers added
ACTIVE_MINISTRY = active in ministry seva
GOSPEL_SHARING = sharing gospel/prachaar

prayerKeys - pick ALL matching values:
FINANCIAL = money/aarthik problem
HEALTH = health/swasthya issue
MARRIAGE = wedding/shaadi/beti ki shaadi
CHURCH_PLANTING = kalisia ropad/church planting
FAMILY_ISSUE = family/parivarik problem
SPIRITUAL = aatmik/spiritual challenge
COMMUNITY = social/samajik problem
EDUCATION = shiksha/education issue

For praiseOther/prayerOther: include any text from those sections not matched above.
For remarks: translate tippani/notes section to English.` }
        ]}]})
      }
    );
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    const txt = (data.candidates?.[0]?.content?.parts?.[0]?.text||'{}')
      .replace(/```[\w]*/g,'').replace(/```/g,'').trim();
    const p = JSON.parse(txt);
    S.form = {
      fvtName: p.fvtName||'', date: p.date||'', workerName: p.workerName||'',
      location: p.location||'', familyMembers: p.familyMembers||'',
      praiseKeys: Array.isArray(p.praiseKeys)?p.praiseKeys:[],
      praiseOther: p.praiseOther||'',
      prayerKeys: Array.isArray(p.prayerKeys)?p.prayerKeys:[],
      prayerOther: p.prayerOther||'', remarks: p.remarks||''
    };
    S.screen='edit'; render();
  }catch(e){
    S.error='Auto-extraction failed ('+e.message+'). Please fill manually.';
    S.screen='edit'; render();
  }
}

/* ── JOTFORM SUBMIT ───────────────────────────── */
async function submitForm(){
  const f = S.form;
  const btn = document.getElementById('btn_submit');
  btn.textContent='⏳ Submitting...'; btn.disabled=true;

  const praiseLabels = f.praiseKeys.map(k=>PRAISE_CATS.find(c=>c.key===k)?.en).filter(Boolean);
  const prayerLabels = f.prayerKeys.map(k=>PRAYER_CATS.find(c=>c.key===k)?.en).filter(Boolean);

  const body = new URLSearchParams();
  body.append('submission[2]',  f.fvtName);
  body.append('submission[3]',  f.date);
  body.append('submission[4]',  f.workerName);
  body.append('submission[5]',  f.location);
  body.append('submission[6]',  f.familyMembers);
  praiseLabels.forEach(l => body.append('submission[22][]', l));
  body.append('submission[23]', f.praiseOther);
  prayerLabels.forEach(l => body.append('submission[24][]', l));
  body.append('submission[25]', f.prayerOther);
  body.append('submission[20]', f.remarks);

  try{
    const res = await fetch(
      `https://api.jotform.com/form/${FORM_ID}/submissions?apiKey=${jKey()}`,
      { method:'POST', body }
    );
    const data = await res.json();
    if(data.responseCode===200||data.responseCode===201){
      S.screen='done'; render();
    } else {
      throw new Error(data.message||'Submission failed — check Jotform API key');
    }
  }catch(e){
    btn.textContent='🚀 Submit to Jotform'; btn.disabled=false;
    alert('Error: '+e.message);
  }
}

render();
</script>
</body>
</html>
